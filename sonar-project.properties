sonar.projectKey=rustnn
sonar.projectName=rustnn
sonar.projectVersion=0.1.0
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Supressoes dos kernels numericos. O motivo esta em
# docs/ADR-001-complexidade-em-kernels.md; o resumo e que a refatoracao que
# essas regras pedem e a que `--gemmbench` e `--bench` rejeitam. Ficam aqui, e
# nao como "Won't Fix" na interface, porque o estado da interface vive no banco
# do servidor: um servidor novo perde tudo e a justificativa nunca aparece em
# code review.
sonar.issue.ignore.multicriteria=gemm,conv,attn,norm,dup,simd

# gemm.rs: micro-kernel AVX2 6x16 e empacotamento dos dois operandos. Os doze
# acumuladores ymm mais os tres de apoio ocupam os dezesseis registradores
# vetoriais da maquina; funcao extraida no meio do laco arrisca derrame.
sonar.issue.ignore.multicriteria.gemm.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.gemm.resourceKey=src/gemm.rs

# conv.rs: im2col e col2im fundidos ao empacotamento. Separar devolve a matriz
# intermediaria que a fusao existe para evitar.
sonar.issue.ignore.multicriteria.conv.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.conv.resourceKey=src/conv.rs

# attn.rs: Q/K/V em L1 com o softmax fundido entre os dois gemm_small.
sonar.issue.ignore.multicriteria.attn.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.attn.resourceKey=src/attn.rs

# norm.rs: os nove taps do depthwise 3x3 escritos abertos, que e o que faz o
# laco vetorizar sobre os canais.
sonar.issue.ignore.multicriteria.norm.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.norm.resourceKey=src/norm.rs

# Os mesmos nove taps aparecem no forward e no backward do depthwise. Unifica-los
# e exatamente o que quebra a vetorizacao.
sonar.issue.ignore.multicriteria.dup.ruleKey=common-rust:DuplicatedBlocks
sonar.issue.ignore.multicriteria.dup.resourceKey=src/norm.rs

# `use std::arch::x86_64::*` dentro de uma funcao #[target_feature] traz uns
# quinze nomes _mm256_* usados uma vez cada: e a forma idiomatica dos
# intrinsecos. O curinga de escopo de modulo, em model.rs, foi corrigido.
sonar.issue.ignore.multicriteria.simd.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.simd.resourceKey=src/gemm.rs
